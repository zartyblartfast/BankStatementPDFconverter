<form method="get" class="card" data-movement-scope style="display:flex; flex-wrap:wrap; gap:12px; align-items:end;">
  <label>Account<br><select name="account_id">
    <option value="">All owned GBP accounts</option>
    {% for account in accounts %}<option value="{{ account.account_id }}" {% if account_id == account.account_id %}selected{% endif %}>{{ account.display_name }}</option>{% endfor %}
  </select></label>
  <label>Period<br><select name="period">
    {% if active_page == 'home' %}
    {% for key, label in [('this_month','This month so far'),('last_month','Last month'),('last_3_months','Last 3 months'),('last_quarter','Last calendar quarter')] %}<option value="{{ key }}" {% if period.kind == key %}selected{% endif %}>{{ label }}</option>{% endfor %}
    {% endif %}
    {% for key, label in [('all','All dates'),('custom','Custom dates'),('year','Calendar year'),('month','Calendar month')] %}<option value="{{ key }}" {% if period.kind == key %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select></label>
  <label>Year<br><input name="year" type="number" min="1" max="9999" value="{{ period.year }}" style="width:85px"></label>
  <label>Month<br><input name="month" type="number" min="1" max="12" value="{{ period.month }}" style="width:65px"></label>
  <label>From<br><input name="start" type="date" value="{{ period.start }}"></label>
  <label>To<br><input name="end" type="date" value="{{ period.end }}"></label>
  <button type="submit" class="btn btn-primary">Apply filters</button>
  <span class="muted">{{ period.label }}{% if active_page == 'home' %} · {{ period.range }}{% endif %} · GBP · transaction date{% if not accounts %} · No supported accounts available{% endif %}</span>
  <p class="muted" data-period-help style="flex-basis:100%;font-size:0.8rem;">Year for calendar year or month; Month for calendar month; From and To for custom dates. All dates needs none of these fields.</p>
</form>
<script src="{{ url_for('static', filename='period_scope.js') }}" defer></script>
